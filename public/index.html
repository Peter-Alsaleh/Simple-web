<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصميم عصري بخلفية 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* الكود الأساسي الجديد لخلفية الـ 3D */
      /* ستحتاج لحفظ صورة الخلفية المقترحة ووضع مسارها هنا */
      background-image: url('bg-3d.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
      /* لون احتياطي في حال لم يتم تحميل الصورة */
      background-color: #0d1221; 
      
      position: relative;
      overflow: hidden;
    }

    /* يمكنك إضافة تأثير ضوئي إضافي فوق الخلفية لتعميق الإحساس بالـ 3D */
    body::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle at center, rgba(168, 85, 247, 0.1) 0%, rgba(13, 18, 33, 0) 70%);
      z-index: -1;
    }

    /* كود البطاقة كما هو */
    .card {
      position: relative;
      background: rgba(30, 41, 59, 0.6); /* جعل الخلفية أكثر شفافية لرؤية الـ 3D */
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.85rem;
      font-weight: 700;
      color: #ffffff;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* الأزرار */
    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      text-decoration: none;
    }

    .btn.primary {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    .btn.primary:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
  </style>
</head>
<body>
  
  <main class="card">
    <span class="badge">جديد</span>
    <h1>تصميم عصري وجذاب</h1>
    <p>صفحة بسيطة بلمسات أنيقة مثل التأثيرات الضوئية والتنقل السلس للتحكم في عناصر التجربة بشكل مميز.</p>
    
    <div class="actions">
      <a href="#" class="btn primary">ابدأ الآن</a>
      <a href="#" class="btn secondary">معرفة المزيد</a>
    </div>
  </main>
</body>
</html>
