<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js 24 Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Node.js 24 Task Manager</h1>

        <p class="subtitle">
            Simple Web Application using Node.js 24 LTS & Express
        </p>

        <div class="task-form">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            />

            <button onclick="addTask()">
                Add Task
            </button>
        </div>

        <div class="tasks-container">
            <h2>My Tasks</h2>

            <ul id="taskList"></ul>
        </div>

        <div class="status">
            <button onclick="checkHealth()">
                Check Server
            </button>

            <p id="serverStatus"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
